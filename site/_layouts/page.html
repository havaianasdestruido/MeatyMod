---
layout: default
---

<article class="prose-page">
  <div class="wrap wrap--narrow">
    <header class="prose-page__header">
      {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif -%}
      <h1>{{ page.title }}</h1>
      {%- if page.description %}<p class="lede">{{ page.description }}</p>{% endif -%}
    </header>

    <div class="prose">
      {{ content }}
    </div>

    <footer class="prose-page__footer">
      <p>
        Looking for the full technical reference?
        <a href="{{ site.docs_url | relative_url }}">Read the documentation &rarr;</a>
      </p>
    </footer>
  </div>
</article>
